# Local-only broker for the RED streaming demo.
# TCP for the agent and replayer; WebSockets so the browser can subscribe with
# no backend of our own.
listener 1891 127.0.0.1
protocol mqtt
allow_anonymous true

listener 9009 127.0.0.1
protocol websockets
allow_anonymous true

# A slow agent must never drop samples — dropping would misalign the window
# stream against the replayer's row counter.
max_queued_messages 0
persistence false
log_type warning
